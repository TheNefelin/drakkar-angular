<header class="fixed inset-x-0 top-0 z-50 border-b border-base-300 bg-base-100/90 backdrop-blur-md">
  <div class="navbar mx-auto max-w-4xl px-5 py-2">
    <div class="navbar-start w-auto flex-1 gap-3">
      <a routerLink="/" fragment="inicio" class="flex items-center gap-3">
        <span class="grid h-13 w-13 place-items-center overflow-hidden border-2 border-danger bg-danger text-white">
          <img ngSrc="logo.png" width="900" height="900" priority alt="Logo Transportes Drakar" class="h-full w-full object-cover" />
        </span>
        <span class="flex flex-col leading-tight">
          <span class="font-body text-xs font-bold tracking-[0.3em] text-primary">TRANSPORTES</span>
          <span class="flex font-display text-2xl font-black italic tracking-widest text-danger">
            <span class="inline-block rounded-sm bg-danger pt-2 px-2 leading-none text-white">D</span>
            <span class="pt-1">RAKKAR</span>
          </span>
        </span>
      </a>
    </div>

    <div class="navbar-end w-auto">
      <!-- Desde 640px: botón visible -->
      <a routerLink="/" fragment="contacto" class="btn btn-primary hidden rounded-sm sm:inline-flex">Contáctanos</a>

      <!-- Bajo 640px: hamburguesa con el botón dentro -->
      <div class="dropdown dropdown-end sm:hidden">
        <div tabindex="0" role="button" class="btn btn-ghost" aria-label="Abrir menú">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </div>
        <ul tabindex="-1" class="menu dropdown-content z-10 mt-3 w-56 rounded-box bg-base-100 p-2 shadow">
          <li>
            <a routerLink="/" fragment="contacto" class="btn btn-primary rounded-sm" onclick="document.activeElement.blur()">Contáctanos</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
