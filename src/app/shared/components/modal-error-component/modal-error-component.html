@if (errorService.error()) {
  <dialog class="modal modal-open modal-bottom sm:modal-middle">
    <div class="modal-box border border-danger">
      <h3 class="text-lg font-bold text-danger">ERROR!</h3>
      <p class="py-4">{{ errorService.error() }}</p>
      <div class="modal-action">
        <form method="dialog">
          <!-- if there is a button in form, it will close the modal -->
          <button (click)="errorService.clear()" class="btn bg-danger">Cerrar</button>
        </form>
      </div>
    </div>
  </dialog>
}
