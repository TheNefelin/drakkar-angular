<div class="toast toast-end toast-bottom z-50" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="alert alert-base-100 border-1 border-success">
      <span class="font-bold">{{ toast.message }}</span>

      <button class="btn btn-ghost btn-xs" type="button" aria-label="Cerrar"
        (click)="toastService.clear(toast.id)">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-4" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
  }
</div>
