<section id="servicios" class="bg-base-100">
  <div class="mx-auto max-w-5xl px-5 py-16">
    <div class="mb-10 text-center">
      <p class="text-xs font-bold uppercase tracking-[0.4em] text-secondary">Nuestros servicios</p>
      <h2 class="mt-3 font-display text-3xl font-black text-base-content sm:text-4xl">Transporte terrestre y retiro</h2>
    </div>
    <div class="grid gap-6 sm:grid-cols-2">
      @for (service of services(); track service.name) {
        <div class="card bg-base-300 shadow-sm transition hover:-translate-y-1 hover:shadow-lg">
          <div class="card-body items-center text-center">
            <div class="grid h-14 w-14 place-items-center rounded-full border-2 border-primary/40 bg-base-200 text-2xl text-primary">{{ service.icon }}</div>
            <h3 class="card-title mt-2 font-display text-lg text-base-content">{{ service.name }}</h3>
            <p class="text-sm leading-relaxed text-base-content/70">{{ service.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
