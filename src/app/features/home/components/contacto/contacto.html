<section id="contacto" class="py-24">
  <div class="mx-auto max-w-3xl px-5">
    <div class="text-center">
      <p class="mb-3 text-xs font-bold uppercase tracking-[0.4em] text-secondary">Contacto</p>
      <h2 class="font-display text-4xl font-black text-base-content sm:text-5xl">Escríbenos</h2>
      <p class="mx-auto mt-4 max-w-md text-base-content/70">Déjanos tu mensaje y te respondemos a la brevedad.</p>
    </div>

    <div class="card mt-12 bg-base-200 shadow-sm">
      <div class="card-body p-7 sm:p-10">
        <form (submit)="onSubmit($event)">
          <fieldset class="grid gap-5 sm:grid-cols-2">
            <legend class="mb-2 sr-only">Contacto</legend>
            <label class="form-control">
              <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Nombre</span>
              <input name="nombre" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Tu nombre" />
            </label>
            <label class="form-control">
              <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Email</span>
              <input name="email" type="email" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="tu@email.com" />
            </label>
            <label class="form-control">
              <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Teléfono / WhatsApp</span>
              <input name="telefono" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="+56 9 ..." />
            </label>
            <label class="form-control sm:col-span-2">
              <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Mensaje</span>
              <textarea name="mensaje" required rows="4" class="textarea textarea-bordered w-full bg-base-100 text-base-content" placeholder="Cuéntanos qué necesitas"></textarea>
            </label>
          </fieldset>
          <button type="submit" class="btn btn-lg btn-primary mt-7 w-full rounded-sm">Enviar mensaje</button>
          @if (submitted()) {
            <div class="alert alert-success mt-4">
              <span>Gracias por tu mensaje. Te contactamos a la brevedad.</span>
            </div>
          }
        </form>
      </div>
    </div>
  </div>
</section>
