@if (errorMessage()) {
  <div class="pb-4">
    <app-message-error-component [message]="errorMessage()"/>
  </div>
}
<form novalidate (submit)="onSubmit($event)">
  <fieldset class="grid gap-5 sm:grid-cols-2" 
    [disabled]="isLoading()">
    
    <legend class="mb-2 sr-only">Contacto</legend>
    
    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Nombre</span>
      <input name="name" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Tu nombre" 
        #name 
        maxlength="100"
        (beforeinput)="onNameBeforeInput($event)"
        (input)="updateName(name.value)"/>
    </label>
    
    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Email</span>
      <input name="email" type="email" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="tu@email.com" 
        #email 
        maxlength="254"
        (input)="updateEmail(email.value)"/>
    </label>

    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Teléfono / WhatsApp</span>
      <input name="phone" required inputmode="numeric" type="tel" maxlength="11" class="input input-bordered w-full bg-base-100 text-base-content" placeholder="56 9 XXXXXXXXX" 
        #phone
        (beforeinput)="onPhoneBeforeInput($event)"
        (input)="updatePhone(phone.value)"/>
    </label>

    <label class="form-control sm:col-span-2">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Mensaje</span>
      <textarea #message name="message" required rows="4" class="textarea textarea-bordered w-full bg-base-100 text-base-content" placeholder="Cuéntanos qué necesitas"
        maxlength="500"
        (input)="updateMessage(message.value)"></textarea>
      <div class="mt-1 text-right text-xs text-base-content/60">{{ messageCounter() }}/500</div>
    </label>
  </fieldset>
  
  <button type="submit" class="btn btn-lg btn-primary mt-7 w-full rounded-sm"
    [disabled]="isLoading()">
    
    @if (isLoading()) {
      <span class="loading loading-spinner loading-md"></span>
    } @else {
      Enviar mensaje
    }
  </button>

</form>
