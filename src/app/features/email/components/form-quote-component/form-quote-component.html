<form (submit)="onSubmit($event)" novalidate>
  <fieldset class="grid gap-5 sm:grid-cols-2">
    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Origen</span>
      <input name="origin" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Comuna o dirección" />
      @if (errors().origin) {
        <span class="mt-1 text-xs text-error">{{ errors().origin }}</span>
      }
    </label>
    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Destino</span>
      <input name="destination" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Comuna o dirección" />
      @if (errors().destination) {
        <span class="mt-1 text-xs text-error">{{ errors().destination }}</span>
      }
    </label>
    <label class="form-control sm:col-span-2">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Servicio</span>
      <select name="service" class="select select-bordered w-full bg-base-100 text-base-content">
        <option>Flete</option>
        <option>Mudanza</option>
        <option>Retiro de escombros</option>
        <option>Retiro de cachureos</option>
        <option>Servicio para empresa</option>
        <option>Otro</option>
      </select>
      @if (errors().service) {
        <span class="mt-1 text-xs text-error">{{ errors().service }}</span>
      }
    </label>
    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Peso (kg)</span>
      <input name="weight" type="number" min="0" step="1" class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Ej.: 100" />
      @if (errors().weight) {
        <span class="mt-1 text-xs text-error">{{ errors().weight }}</span>
      }
    </label>
    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Volumen (m³)</span>
      <input name="volume" type="number" min="0" step="0.1" class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Ej.: 2.5" />
      @if (errors().volume) {
        <span class="mt-1 text-xs text-error">{{ errors().volume }}</span>
      }
    </label>
    <label class="form-control sm:col-span-2">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Km estimados (opcional)</span>
      <input name="km" type="number" min="0" step="1" class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Se calcula si no lo ingresas" />
      @if (errors().km) {
        <span class="mt-1 text-xs text-error">{{ errors().km }}</span>
      }
    </label>
  </fieldset>
  <button type="submit" class="btn btn-lg btn-primary mt-7 w-full rounded-sm">Calcular estimado</button>
</form>
