<form novalidate (submit)="onSubmit($event)">
  <fieldset class="grid gap-5 sm:grid-cols-2"
    [disabled]="isLoading()">

    <legend class="mb-2 sr-only">Cotización</legend>

    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Tu nombre</span>
      <input name="name" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Tu nombre"
        #name
        maxlength="100"
        (beforeinput)="onNameBeforeInput($event)"
        (input)="updateName(name.value)"/>
    </label>

    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Email</span>
      <input name="email" type="email" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="tu@email.com"
        #email
        maxlength="254"
        (input)="updateEmail(email.value)"/>
    </label>

    <label class="form-control sm:col-span-2">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Teléfono / WhatsApp</span>
      <input name="phone" required inputmode="numeric" type="tel" maxlength="11" class="input input-bordered w-full bg-base-100 text-base-content" placeholder="56 9 XXXXXXXXX"
        #phone
        (beforeinput)="onPhoneBeforeInput($event)"
        (input)="updatePhone(phone.value)"/>
    </label>

    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Origen</span>
      <input name="origin" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Comuna o dirección"
        #origin
        maxlength="200"
        (input)="updateOrigin(origin.value)"/>
    </label>

    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Destino</span>
      <input name="destination" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Comuna o dirección"
        #destination
        maxlength="200"
        (input)="updateDestination(destination.value)"/>
    </label>

    <label class="form-control sm:col-span-2">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Servicio</span>
      <select name="service" class="select select-bordered w-full bg-base-100 text-base-content"
        #service
        (change)="updateService(service.value)">
        <option>Flete</option>
        <option>Mudanza</option>
        <option>Retiro de escombros</option>
        <option>Retiro de cachureos</option>
        <option>Servicio para empresa</option>
        <option>Otro</option>
      </select>
    </label>

    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Peso (kg)</span>
      <input name="weight" type="number" min="0" step="1" max="20000" class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Ej.: 100"
        #weight
        (input)="updateWeight(weight.value)"/>
    </label>

    <label class="form-control">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Volumen (m³)</span>
      <input name="volume" type="number" min="0" step="0.1" max="20000" class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Ej.: 2.5"
        #volume
        (input)="updateVolume(volume.value)"/>
    </label>

    <label class="form-control sm:col-span-2">
      <span class="label-text mb-1.5 text-xs font-bold uppercase tracking-widest text-base-content/60">Km estimados (requerido)</span>
      <input name="km" type="number" min="1" step="1" max="5000" required class="input input-bordered w-full bg-base-100 text-base-content" placeholder="Ej.: 120"
        #km
        (input)="updateKm(km.value)"/>
    </label>
  </fieldset>

  @if (errorMessage()) {
    <div class="mt-5">
      <app-message-error-component [message]="errorMessage()"/>
    </div>
  }

  <button type="submit" class="btn btn-lg btn-primary mt-5 w-full rounded-sm"
    [disabled]="isLoading()">

    @if (isLoading()) {
      <span class="loading loading-spinner loading-md"></span>
    } @else {
      Calcular estimado
    }
  </button>
</form>
