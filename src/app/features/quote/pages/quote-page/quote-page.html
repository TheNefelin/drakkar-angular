<section class="py-30">
  <div class="mx-auto max-w-3xl px-2">
    <div class="text-center">
      <app-section-heading-component eyebrow="Cotización estimativa" title="Simula tu cotización" level="h1" />
      <p class="animate-hero-fade [animation-delay:0.08s] mx-auto mt-4 max-w-md text-base-content/70">Ingresa origen, destino y carga para obtener un estimado al instante.</p>
    </div>

    <div id="quote-result" appReveal class="reveal card mt-12 bg-base-200 shadow-sm">
      <div class="card-body p-2 sm:p-10">
        <app-form-quote-component class="p-5"
          [class.hidden]="quoteResult() || message() === 'Cotización enviada correctamente.'"
          [resetTrigger]="resetTrigger()"
          (formSubmit)="calculate($event)"
        />

        @if (message()) {
          <app-message-success-component [message]="message()"/>
        } @else if (quoteResult()) {
          <app-preview-quote-component
            [quoteResult]="quoteResult()"
            [isLoading]="isLoading()"
            (recalculate)="recalculate()"
            (submit)="submit()"
          />          
        }
      </div>
    </div>
  </div>
</section>
