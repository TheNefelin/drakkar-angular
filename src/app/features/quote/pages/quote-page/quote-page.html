<section class="py-30">
  <div class="mx-auto max-w-3xl px-5">
    <div class="text-center">
      <app-section-heading-component eyebrow="Cotización estimativa" title="Simula tu cotización" level="h1" />
      <p class="animate-hero-fade [animation-delay:0.08s] mx-auto mt-4 max-w-md text-base-content/70">Ingresa origin, destination y carga para obtener un estimado al instante.</p>
    </div>

    <div appReveal class="reveal card mt-12 bg-base-200 shadow-sm">
      <div class="card-body p-7 sm:p-10">
        @if (quoteResult()) {
          <app-previewe-quote-component
            [quoteResult]="quoteResult()"
            (recalculate)="recalculate()"
            (submit)="submit()"
          />          
        } @else {
          <app-form-quote-component (formSubmit)="calculate($event)"/>
        }
      </div>
    </div>
  </div>
</section>
